name: validate

on:
  push:
  pull_request:

jobs:
  skill-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate TalkTrace Skill package
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          required = [
              Path("SKILL.md"),
              Path("references/interview-plan.md"),
              Path("references/interview-guide.md"),
              Path("references/interview-notes.md"),
              Path("references/interview-delta.md"),
              Path("assets/interview-plan-template.csv"),
              Path("assets/interview-guide-client.md"),
              Path("assets/interview-guide-internal.md"),
              Path("assets/interview-notes-template.md"),
              Path("packaging/runtime-files.txt"),
              Path("evals/README.md"),
              Path("evals/cases.md"),
              Path("evals/cold-start.md"),
              Path("evals/sequential-context.md"),
              Path("evals/premise-safety.md"),
              Path("workbuddy/SMOKE.md"),
          ]

          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              print("Missing required files:", *missing, sep="\n- ")
              sys.exit(1)

          runtime_manifest = Path("packaging/runtime-files.txt")
          runtime_files = []
          for raw in runtime_manifest.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              path = Path(line)
              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"Unsafe runtime manifest path: {line}")
              if line in runtime_files:
                  raise SystemExit(f"Duplicate runtime manifest path: {line}")
              if not path.is_file():
                  raise SystemExit(f"Runtime manifest file missing: {line}")
              runtime_files.append(line)

          expected_runtime = [
              "SKILL.md",
              "references/interview-plan.md",
              "references/interview-guide.md",
              "references/interview-notes.md",
              "references/interview-delta.md",
              "assets/interview-plan-template.csv",
              "assets/interview-guide-client.md",
              "assets/interview-guide-internal.md",
              "assets/interview-notes-template.md",
          ]
          if runtime_files != expected_runtime:
              raise SystemExit(
                  "TalkTrace runtime manifest drifted from the frozen nine-file contract:\n"
                  + "\n".join(runtime_files)
              )

          skill = Path("SKILL.md").read_text(encoding="utf-8")
          if not skill.startswith("---\n"):
              raise SystemExit("SKILL.md must start with YAML frontmatter")

          match = re.match(r"---\n(.*?)\n---\n", skill, flags=re.S)
          if not match:
              raise SystemExit("SKILL.md frontmatter is malformed")

          frontmatter = match.group(1)
          for key in ("name:", "description:"):
              if key not in frontmatter:
                  raise SystemExit(f"SKILL.md frontmatter missing {key}")

          refs = [
              "references/interview-plan.md",
              "references/interview-guide.md",
              "references/interview-notes.md",
              "references/interview-delta.md",
          ]
          for ref in refs:
              if ref not in skill:
                  raise SystemExit(f"SKILL.md does not route to {ref}")

          if "当前 AI 工作上下文" not in skill and "当前上下文" not in skill:
              raise SystemExit("SKILL.md must define current context as the working memory")

          if "是否存在/是否发生/是否普遍" not in skill:
              raise SystemExit("SKILL.md must propagate semantic premise-safety")

          for required_phrase in (
              "默认不要机械展示给用户",
              "顾问可以直接继续使用的轻量工作纪要",
              "不默认展开完整竞争假设树",
              "Cold-start / broad request routing",
              "先有用，再澄清",
              "Quick Plan / 快速计划",
              "Next Interview Refresh",
          ):
              if required_phrase not in skill:
                  raise SystemExit(f"SKILL.md missing UX guard: {required_phrase}")

          plan = Path("references/interview-plan.md").read_text(encoding="utf-8")
          for required_phrase in (
              "重点验证/信息缺口",
              "Quick Plan｜快速计划",
              "Scheduled Plan｜正式排程",
              "不伪造人员可用时间",
          ):
              if required_phrase not in plan:
                  raise SystemExit(f"Interview Plan missing product behavior: {required_phrase}")

          guide = Path("references/interview-guide.md").read_text(encoding="utf-8")
          for required_phrase in (
              "Semantic premise gates",
              "Existence gate",
              "Continuation gate",
              "Scope / recurrence gate",
              "Actor / authority gate",
              "Sequence / mechanism gate",
              "Causality gate",
              "Case-to-mechanism rule",
              "Premise preflight",
          ):
              if required_phrase not in guide:
                  raise SystemExit(f"Interview Guide missing semantic premise-safety mechanism: {required_phrase}")

          # Unsafe sentences may intentionally appear as documented counterexamples.
          # CI validates the general prevention mechanism instead of a keyword blacklist.

          notes = Path("references/interview-notes.md").read_text(encoding="utf-8")
          for required_phrase in (
              "Default user-facing structure",
              "核心观点",
              "关键事实与案例",
              "待核实事项",
              "对后续访谈的影响",
              "不应把纪要写成证据审计报告",
          ):
              if required_phrase not in notes:
                  raise SystemExit(f"Interview Notes missing lightweight UX behavior: {required_phrase}")

          premise = Path("evals/premise-safety.md").read_text(encoding="utf-8")
          for required_phrase in (
              "R1｜Existence presupposition",
              "R2｜Continuation presupposition",
              "R4｜Single-case → recurring mechanism",
              "R5｜Actor / authority presupposition",
              "R6｜Sequence / mechanism presupposition",
              "R7｜Causal presupposition",
              "R8｜Conditional wording can still be unsafe",
              "Semantic, not keyword-only",
          ):
              if required_phrase not in premise:
                  raise SystemExit(f"Premise-safety regression set missing assertion: {required_phrase}")

          delta = Path("references/interview-delta.md").read_text(encoding="utf-8")
          for required_phrase in ("新增信息", "已回答的问题", "冲突", "Refresh subsequent interviews", "当前上下文"):
              if required_phrase not in delta:
                  raise SystemExit(f"Interview Delta missing required behavior: {required_phrase}")

          sequential = Path("evals/sequential-context.md").read_text(encoding="utf-8")
          for required_phrase in ("Stage 3｜Interview Delta", "Stage 4｜Refresh the next interview", "单一来源", "不预设吴川拍板"):
              if required_phrase not in sequential:
                  raise SystemExit(f"Sequential regression case missing assertion: {required_phrase}")

          cold_start = Path("evals/cold-start.md").read_text(encoding="utf-8")
          for required_phrase in (
              "C1｜Broad ask with project materials",
              "C2｜Named functional leader, no project context",
              "C3｜Plan request without scheduling constraints",
              "C4｜Natural refresh request",
              "先有用，再澄清",
              "不暴露内部机制",
              "Quick Plan",
          ):
              if required_phrase not in cold_start:
                  raise SystemExit(f"Cold-start regression set missing assertion: {required_phrase}")

          smoke = Path("workbuddy/SMOKE.md").read_text(encoding="utf-8")
          if "S6｜Sequential Interview Delta / Refresh" not in smoke:
              raise SystemExit("WorkBuddy smoke must include sequential-context validation")
          for required_phrase in (
              "轻量纪要",
              "不默认展开完整竞争假设树",
          ):
              if required_phrase not in smoke:
                  raise SystemExit(f"WorkBuddy smoke missing lightweight UX check: {required_phrase}")

          print("TalkTrace standalone structure: PASS")
          print("TalkTrace runtime manifest: PASS")

      - name: Assemble clean TalkTrace runtime package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/TalkTrace

          while IFS= read -r raw || [[ -n "$raw" ]]; do
            file="${raw%%#*}"
            file="$(printf '%s' "$file" | xargs)"
            [[ -z "$file" ]] && continue
            mkdir -p "dist/TalkTrace/$(dirname "$file")"
            cp "$file" "dist/TalkTrace/$file"
          done < packaging/runtime-files.txt

          grep -vE '^[[:space:]]*(#|$)' packaging/runtime-files.txt | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sort > /tmp/expected-runtime-files.txt
          find dist/TalkTrace -type f -printf '%P\n' | sort > /tmp/actual-runtime-files.txt
          diff -u /tmp/expected-runtime-files.txt /tmp/actual-runtime-files.txt

          if find dist/TalkTrace -type f | grep -Eq '/(evals|docs|workbuddy|\.github|packaging)/'; then
            echo "Maintainer-only files leaked into runtime package"
            exit 1
          fi

          echo "Clean TalkTrace runtime package: PASS"
          find dist/TalkTrace -type f -printf '%P\n' | sort

      - name: Upload colleague-distributable runtime package
        uses: actions/upload-artifact@v4
        with:
          name: TalkTrace-v0.1.0-runtime-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
